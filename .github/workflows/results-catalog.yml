name: Update simulation result catalogs
on:
  push:
    branches: [main, 'results/**', 'simulation/**']
    paths: ['results/**', 'scripts/results/**', '.github/workflows/results-catalog.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: simulation-result-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
      - name: Synchronize main and condition branches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/results/catalog.py sync --push
